name: R-CMD-check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}

    # The live BOJ integration test is opt-in and must not run in CI.
    env:
      READBOJ_LIVE_TESTS: "false"
      READBOJ_LIVE_EXAMPLES: "false"
      R_KEEP_PKG_SOURCE: "yes"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 # v2

      - name: Set up R
        uses: r-lib/actions/setup-r@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@3d375b4861295696a870e3f189d4564d4ca9da6d # v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          upload-results: true
