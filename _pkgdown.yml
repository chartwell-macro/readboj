  - title: Tankan releases
    contents:
      - list_boj_tankan_releases
      - list_boj_tankan_assets
      - download_boj_tankan_asset
  - title: Reproducibility, cache, and provenance
    contents:
      - read_boj_snapshot
      - boj_provenance
      - boj_cache_prune
  - title: Outlook forecasts and maintenance
    contents:
      - list_boj_outlook_releases
      - read_boj_outlook
      - boj_outlook_data_dir
      - boj_outlook_status
      - update_boj_outlook
      - build_boj_outlook_bundle
      - list_boj_outlook_calendar
      - maintain_boj_outlook
      - boj_outlook_maintenance_status
      - list_boj_outlook_releases_raw
      - read_boj_outlook_raw
  - title: Service information
