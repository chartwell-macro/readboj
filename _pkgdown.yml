url: https://chartwell-macro.github.io/readboj/

development:
  mode: auto

destination: _site

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: Get started
      href: articles/readboj.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Workflows
      menu:
        - text: Getting started
          href: articles/readboj.html
        - text: API workflows
          href: articles/api-workflows.html
        - text: Official files
          href: articles/official-files.html
        - text: Reproducibility
          href: articles/reproducibility.html
        - text: Troubleshooting
          href: articles/troubleshooting.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github
      aria-label: GitHub
      href: https://github.com/chartwell-macro/readboj

reference:
  - title: Catalogue discovery
    contents:
      - build_boj_catalogue_snapshot
      - search_boj_catalogue_snapshot
  - title: API observations
    contents:
      - boj_databases
      - boj_metadata
      - search_boj_series
      - read_boj_series
      - read_boj_layer
  - title: Bulk files and workbooks
    contents:
      - list_boj_bulk_files
      - download_boj_bulk
      - read_boj_bulk
